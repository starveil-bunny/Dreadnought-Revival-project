<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle viewer</title>
<style>
:root { --bg: #07090d; --panel: rgba(14, 18, 25, 0.92); --line: #1f2733; --text: #d7dee8; --dim: #7d8896; --accent: #f0b43c; --t1: #4f9dff; --t2: #ff5a5a; --t0: #a0a8b4; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
#app { display: grid; grid-template-rows: 38px 1fr; grid-template-columns: 1fr 300px; height: 100%; }
#top { grid-column: 1 / 3; display: flex; align-items: stretch; background: #0b0e13; border-bottom: 1px solid var(--line); }
#tabs { display: flex; overflow-x: auto; flex: 1; }
#tabs button { background: none; border: 0; border-right: 1px solid var(--line); color: var(--dim); padding: 0 16px; font: inherit; cursor: pointer; white-space: nowrap; }
#tabs button.on { color: var(--text); background: #141a23; box-shadow: inset 0 -2px var(--accent); }
#tabs button .n { color: var(--accent); margin-left: 6px; }
#tabs .none { color: var(--dim); padding: 10px 16px; }
#status { color: var(--dim); padding: 10px 14px; white-space: nowrap; }
#view { position: relative; min-width: 0; min-height: 0; }
/* Launcher (player mode): the launcher's backdrop shows around the view; the
   view itself stays as it is. */
html.player, html.player body { background: transparent; }
html.player #view { background: var(--bg); }
html.player #top { background: rgba(8,11,16,.72); backdrop-filter: blur(6px); }
html.player #side { background: rgba(9,13,19,.8); backdrop-filter: blur(6px); }
#vclose { background: none; border: 0; border-left: 1px solid var(--line); color: var(--text); padding: 0 18px; font: inherit; letter-spacing: .12em; cursor: pointer; }
#vclose:hover { color: var(--accent); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; outline: none; }
#ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#stabs { display: flex; border-bottom: 1px solid var(--line); }
#stabs button { flex: 1; background: none; border: 0; color: var(--dim); padding: 9px 0; font: inherit; cursor: pointer; }
#stabs button.on { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
.pane { flex: 1; overflow-y: auto; padding: 8px 0; }
.team { margin-bottom: 10px; }
.team h3 { margin: 0; padding: 4px 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; }
.sep { height: 1px; background: var(--line); margin: 3px 12px; }
.ship { display: grid; grid-template-columns: 22px 1fr 44px; gap: 8px; align-items: center; padding: 3px 12px; cursor: pointer; }
.ship:hover { background: rgba(255,255,255,.04); }
.ship.sel { background: rgba(240,180,60,.12); }
.ship .ic { width: 20px; height: 20px; }
.ship .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ship.bot .nm { color: var(--dim); }
.hp { height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
.hp i { display: block; height: 100%; }
#selbox { border-top: 1px solid var(--line); padding: 10px 12px; }
#selbox .t { font-weight: 600; }
#selbox .d { color: var(--dim); margin: 2px 0 8px; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px; }
.btns h4 { grid-column: 1 / 3; margin: 10px 0 0; font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
.sl { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.sl input { flex: 1; }
button.b { background: #18202b; border: 1px solid #263140; color: var(--text); border-radius: 4px; padding: 6px 4px; font: inherit; cursor: pointer; }
button.b.on { border-color: var(--accent); color: var(--accent); }
button.b:hover { border-color: var(--accent); }
button.b.red { color: #ff8a8a; }
#chat { position: absolute; left: 12px; bottom: 12px; width: min(460px, 60%); pointer-events: none; }
#chatlog { max-height: 220px; overflow-y: auto; font-size: 13px; text-shadow: 0 1px 2px #000; pointer-events: auto; scrollbar-width: none; }
#chatlog div { padding: 1px 0; }
#chatlog .ch { color: var(--dim); }
#chatlog .me { color: var(--accent); }
#chatlog .sys { color: #9fd3a8; }
#chatlog .err { color: #ff8a8a; }
#chatin { width: 100%; margin-top: 4px; background: rgba(0,0,0,.55); border: 1px solid #2a3442; color: var(--text); padding: 6px 8px; font: inherit; border-radius: 3px; pointer-events: auto; }
#chatin:focus { outline: none; border-color: var(--accent); }
#hint { position: absolute; right: 10px; bottom: 8px; color: var(--dim); font-size: 11px; pointer-events: none; text-align: right; }
#lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; }
#lock button { background: #1d2a3a; border: 1px solid #2a3442; color: var(--text); padding: 8px 14px; font: inherit; cursor: pointer; }
#lock button:hover { background: #26384d; }
#lock input { background: #11161e; border: 1px solid #2a3442; color: var(--text); padding: 8px 10px; font: inherit; width: 260px; }
#feed { position: absolute; right: 12px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; pointer-events: none; font-size: 13px; text-shadow: 0 1px 2px #000; }
#feed div { background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 3px; transition: opacity .6s; }
.kx { color: var(--dim); margin: 0 6px; }
.sc { padding: 0 12px; }
.sc .tot { display: flex; justify-content: space-around; font-size: 22px; font-weight: 600; margin: 4px 0 10px; }
.sc .tot small { display: block; font-size: 11px; color: var(--dim); font-weight: 400; text-align: center; }
.sc table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
.sc th { color: var(--dim); font-weight: 500; text-align: right; padding: 2px 3px; }
.sc td { text-align: right; padding: 2px 3px; }
.sc th:first-child, .sc td:first-child { text-align: left; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc tr.bot td:first-child { color: var(--dim); }
.sc tr.me td { color: var(--accent); }
.sc h4 { margin: 10px 0 4px; font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
.sc .kl { font-size: 12px; padding: 1px 0; }
.ship.me .nm { color: var(--accent); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="lock" class="hidden"><form id="lockf"><input id="key" type="password" placeholder="Admin key" autocomplete="current-password"> <button type="submit" id="keygo">Open viewer</button><div id="keyerr" style="margin-top:8px;color:#e07a6a"></div></form></div>
<div id="app">
  <div id="top"><div id="tabs"></div><div id="status"></div></div>
  <div id="view">
    <canvas id="cv" tabindex="0"></canvas>
    <canvas id="ov"></canvas>
    <div id="chat"><div id="chatlog"></div><input id="chatin" maxlength="200" placeholder="Enter to chat · /command"></div>
    <div id="feed"></div>
    <div id="hint">WASD · Space/Shift · LMB orbit · RMB look · click ship · F fit</div>
  </div>
  <div id="side">
    <div id="stabs"><button data-p="ships" class="on">Ships</button><button data-p="score">Score</button><button data-p="ctl">Controls</button></div>
    <div id="p-ships" class="pane"></div>
    <div id="p-score" class="pane sc hidden"></div>
    <div id="p-ctl" class="pane hidden">
      <div class="btns">
        <h4>Fun</h4>
        <button class="b" data-cmd="/meteor 12">Meteors</button>
        <button class="b" data-cmd="/meteor 40">Storm</button>
        <button class="b" data-cmd="/boss">Boss</button>
        <button class="b" data-cmd="/spawn boss 3">3 bosses</button>
        <button class="b" data-cmd="/shake 6">Shake</button>
        <button class="b red" data-cmd="/nuke">Nuke</button>
        <button class="b" data-cmd="/flash pink">Pink</button>
        <button class="b" data-cmd="/flash gold">Gold</button>
        <h4>Speed</h4>
        <button class="b" data-cmd="/slowmo 0.4">Slow-mo</button>
        <button class="b" data-cmd="/slowmo 1">Normal</button>
        <button class="b" data-cmd="/turbo on">Turbo</button>
        <button class="b" data-cmd="/turbo off">Turbo off</button>
        <h4>Bots</h4>
        <button class="b" data-cmd="/npc brutal">Brutal</button>
        <button class="b" data-cmd="/npc normal">Normal</button>
        <button class="b" data-cmd="/wave skip">Skip wave</button>
        <h4>View</h4>
        <button class="b" id="ps2">PS2 Models</button>
        <h4>Mesh detail</h4>
        <label class="sl">Terrain <input type="range" id="det-t" min="1" max="4" step="1"> <span id="det-tv"></span></label>
        <label class="sl">Objects <input type="range" id="det-o" min="0.5" max="3" step="0.5"> <span id="det-ov"></span></label>
      </div>
    </div>
    <div id="selbox" class="hidden"></div>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (e) {} },
  };
  // Player mode: the launcher's battle view (mmogbrain launcherViewerPage sets
  // DN_PLAYER). Any live battle (their own first), chat only, no controls. The
  // launcher frames this page and carries its requests (postMessage to the
  // parent, which asks the launcher's Go side to fetch from the server).
  const PLAYER = window.DN_PLAYER || null;
  let key = PLAYER ? 'player' : store.get('adminKey');
  // No key (a bookmark, or a tab not opened from the dashboard): key intake
  // first, before anything below gets a chance to throw.
  function showLock() { if (PLAYER) return; $('lock').classList.remove('hidden'); $('key').focus(); }
  if (!key) showLock();
  if (PLAYER) {
    document.documentElement.classList.add('player');
    const x = document.createElement('button');
    x.id = 'vclose'; x.textContent = 'CLOSE';
    x.onclick = () => window.parent.postMessage({ dnvClose: 1 }, '*');
    $('top').append(x);
    document.querySelector('#stabs [data-p="ctl"]').remove(); $('p-ctl').remove();
    $('chatin').placeholder = 'Enter to chat · /t for team (in your own battle)';
    $('hint').textContent = 'WASD · Space/Shift · LMB orbit · RMB look · click ship · F fit · Esc close';
  }
  const pending = new Map();
  let reqSeq = 0;
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.dnvReply === undefined) return;
    const p = pending.get(m.dnvReply); if (!p) return;
    pending.delete(m.dnvReply);
    if (m.status >= 200 && m.status < 300) { try { p.ok(JSON.parse(m.body)); } catch (err) { p.no(new Error('bad reply')); } }
    else p.no(new Error(m.status ? String(m.body || '').replace(/^\{"error":"|"\}\s*$/g, '').trim() || 'error ' + m.status : (m.body || 'launcher offline')));
  });
  function papi(path, opts = {}) {
    return new Promise((ok, no) => {
      const id = ++reqSeq;
      pending.set(id, { ok, no });
      setTimeout(() => { if (pending.delete(id)) no(new Error('timed out')); }, 10000);
      window.parent.postMessage({ dnv: id, method: opts.method || 'GET', path, body: opts.body || '' }, '*');
    });
  }
  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) e.append(k instanceof Node ? k : String(k));
    return e;
  }
  async function api(path, opts = {}) {
    const res = await fetch('/admin/api' + path, { ...opts, headers: { 'X-Admin-Key': key || '', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (res.status === 403) { if (key) $('keyerr').textContent = 'That key was rejected.'; key = null; store.del('adminKey'); showLock(); throw new Error('forbidden'); }
    if (!res.ok) throw new Error((await res.text()).replace(/^\{"error":"|"\}\s*$/g, ''));
    return res.json();
  }
  $('lockf').onsubmit = (e) => { e.preventDefault(); key = $('key').value; store.set('adminKey', key); $('lock').classList.add('hidden'); poll(); };

  // --- state ------------------------------------------------------------------
  const TEAM = { 1: '#4f9dff', 2: '#ff5a5a', 3: '#ca7ede', 0: '#a0a8b4' };
  const KINDS = ['ArtilleryCruiser', 'Corvette', 'Destroyer', 'Dreadnought', 'TacticalCruiser'];
  const icons = {};
  for (const k of KINDS) { const im = new Image(); im.src = PLAYER ? (PLAYER.icons || {})[k] || '' : '/admin/viewer/icons/' + k + '.png'; icons[k] = { im, tint: {} }; }
  function tinted(kind, col) {
    const i = icons[kind]; if (!i || !i.im.complete || !i.im.naturalWidth) return null;
    if (!i.tint[col]) {
      const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
      g.drawImage(i.im, 0, 0, 64, 64); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, 64, 64);
      i.tint[col] = c; c.url = c.toDataURL();
    }
    return i.tint[col];
  }
  const S = {
    battles: [], id: '', b: null, ships: [], hist: new Map(), projHist: [], offs: [], lag: 3400, gaps: [], lastT: 0, lastFrame: 0, terrain: null, terrainFor: '',
    chatLast: '', sel: null, pivot: null, follow: null,
    cam: { p: [0, 0, 0], yaw: 0, pitch: -0.5 }, fitted: '', keys: new Set(), drag: null,
  };
  // The host's per-pawn vid when it sends one; class+team+order otherwise, which
  // shifts a bot's history onto its neighbour when one of them dies.
  const shipKey = (s) => s.vid ? 'v' + s.vid : s.pid || `${s.class}@${s.team}#${s.i}`;

  // --- data -------------------------------------------------------------------
  function tabTitle(b) { return [b.mode_name || b.mode || '?', b.map_name || '?'].join(' · '); }
  function renderTabs() {
    const box = $('tabs');
    if (!S.battles.length) { box.replaceChildren(el('div', { class: 'none' }, 'No live battles')); return; }
    const count = {};
    box.replaceChildren(...S.battles.map((b) => {
      const t = tabTitle(b), n = count[t] = (count[t] ?? -1) + 1;
      return el('button', { class: b.battle_match_id === S.id ? 'on' : '', onclick: () => pick(b.battle_match_id) }, t, el('span', { class: 'n' }, b.mine ? 'yours' : '#' + n));
    }));
  }
  // Every battle change resets per-battle state, including the automatic one
  // when the shown battle ends: vids restart at 1 per host, so another
  // battle's ships would otherwise interpolate from this one's positions.
  function setBattle(id) {
    S.id = id; S.meSeen = false; S.killSeen = -1; $('feed').replaceChildren(); scoreSig = ''; S.ships = []; S.hist.clear(); S.projHist = []; S.offs = []; S.gaps = []; S.lastT = 0; S.sel = S.follow = S.pivot = null; S.fitted = ''; S.chatLast = ''; S.terrain = null;
    $('chatlog').replaceChildren();
  }
  function pick(id) {
    if (id === S.id) return;
    setBattle(id); renderTabs(); poll();
  }
  // The host posts a snapshot every ~100 ms (host VIEWER_SNAP_MS), and the
  // battle is polled at that rate, with one request in flight. The battle list
  // is polled every BATTLES_MS. At the old 1 s poll of a 1 s snapshot, playback
  // ran seconds behind and moved in coarse, visibly linear legs (operator,
  // 2026-10-17).
  const POLL_MS = PLAYER ? 200 : 100, BATTLES_MS = 2000, HIST_MAX = 40, PROJ_HIST_MAX = 30;
  let battlesAt = -1e9, polling = false, sideSig = '';
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      let b;
      if (PLAYER) {
        const want = S.id;
        // '/viewer/?battle=': launchers up to f680456 pass only "/viewer" or "/viewer/..." (query included), so "/viewer?battle=" never left them.
        const d = await papi('/viewer' + (want ? '/?battle=' + encodeURIComponent(want) : ''));
        if (S.id !== want) return; // a tab was picked while this was in flight
        b = d.battle;
        const sig = (d.battles || []).map((x) => x.battle_match_id).join(',');
        S.battles = d.battles || [];
        if (sig !== S.tabSig) { S.tabSig = sig; renderTabs(); }
        if (!b) { if (S.id) setBattle(''); S.b = null; S.ships = []; if (sideSig) { sideSig = ''; renderShips(); } $('status').textContent = d.enabled === false ? 'Battle view is off on this server' : 'Not in a battle'; return; }
        if (b.battle_match_id !== S.id) { setBattle(b.battle_match_id); renderTabs(); }
        S.myTeam = d.team;
      } else if (performance.now() - battlesAt > BATTLES_MS || !S.battles.some((b) => b.battle_match_id === S.id)) {
        battlesAt = performance.now();
        const d = await api('/battles');
        S.battles = d.battles || [];
        if (!S.battles.some((b) => b.battle_match_id === S.id)) setBattle(S.battles[0] ? S.battles[0].battle_match_id : '');
        renderTabs();
      }
      if (!S.id) { S.b = null; S.ships = []; if (sideSig) { sideSig = ''; renderShips(); } $('status').textContent = ''; return; }
      if (!PLAYER) b = await api('/battles/' + encodeURIComponent(S.id));
      if (b.battle_match_id !== S.id) return;
      S.b = b;
      const seen = {};
      const ships = (b.ships || []).map((s) => { const k = `${s.class}@${s.team}`; s.i = seen[k] = (seen[k] ?? -1) + 1; return s; });
      // Playback buffer: each ship's positions, stamped with when the host took
      // them (now - age_ms), drawn a lag in the past (playT), between the two
      // samples around that time.
      // Stamp: the server's receive time mapped onto this clock. Reply arrival
      // minus age_ms put a sample late by its reply time (400-770 ms on slow
      // polls), out of step with its neighbours, and shots interpolated
      // between mis-stamped samples ran backwards (operator 2026-10-17). The
      // offset is the smallest arrival-minus-taken seen lately: the fastest
      // reply is the closest to the true clock difference.
      const now = performance.now();
      let taken = now - (b.age_ms || 0);
      if (b.taken_ms) {
        const off = now - b.taken_ms;
        S.offs.push(off); while (S.offs.length > 100) S.offs.shift();
        taken = b.taken_ms + Math.min(...S.offs);
      }
      if (taken > S.lastT + 30) {
        if (S.lastT) { S.gaps.push(taken - S.lastT); while (S.gaps.length > 40) S.gaps.shift(); }
        S.lastT = taken;
      }
      for (const s of ships) {
        const k = shipKey(s), h = S.hist.get(k) || [], last = h[h.length - 1];
        // Only newer stamps: a late post's older one broke the bracket scan.
        if (!last || taken > last.t + 30) { h.push({ t: taken, p: W3(s.x, s.y, s.z), yaw: s.yaw }); h.yaws = null; }
        while (h.length > HIST_MAX) h.shift();
        S.hist.set(k, h);
      }
      for (const k of S.hist.keys()) if (!ships.some((s) => shipKey(s) === k)) S.hist.delete(k);
      const lp = S.projHist[S.projHist.length - 1];
      if (!lp || taken > lp.t + 30) S.projHist.push({ t: taken, p: (b.projectiles || []).map((q) => W3(q[0], q[1], q[2])), k: b.proj_kinds || '', id: b.proj_ids || null, prev: lp || null });
      while (S.projHist.length > PROJ_HIST_MAX) S.projHist.shift();
      if (S.projHist.length) S.projHist[0].prev = null; // or the chain keeps every snapshot alive
      S.ships = ships;
      if (S.sel) S.sel = ships.find((s) => shipKey(s) === shipKey(S.sel)) || null;
      if (S.follow) S.follow = ships.find((s) => shipKey(s) === shipKey(S.follow)) || null;
      // Player mode: ride along with your own ship once it shows up.
      if (PLAYER && !S.meSeen) { const me = ships.find((s) => s.me); if (me) { S.meSeen = true; S.fitted = S.id; select(me, true); } }
      const np = ships.filter((s) => s.player).length;
      $('status').textContent = `${np} player${np === 1 ? '' : 's'} · ${ships.length - np} bots${b.age_ms > 5000 ? ' · stale' : ''}`;
      if (b.terrain && (S.terrainFor !== S.id || S.terrainAt !== b.terrain_at)) {
        S.terrainFor = S.id; S.terrainAt = b.terrain_at;
        (PLAYER ? papi('/viewer/terrain?battle=' + encodeURIComponent(S.id)) : api('/battles/' + encodeURIComponent(S.id) + '/terrain')).then((t) => { if (S.terrainFor === b.battle_match_id) { S.terrainRaw = t; S.terrain = buildTerrain(t); if (S.fitted === S.id + ':ships') S.fitted = ''; } }).catch(() => { S.terrainFor = ''; });
      } else if (!b.terrain && S.terrainFor !== S.id) S.terrain = null;
      if (S.fitted !== S.id && S.fitted !== S.id + ':ships') fit();
      // The sidebar is rebuilt only when what it shows has changed: at ten
      // polls a second, rebuilding it every time is DOM churn for nothing.
      const sig = ships.map((s) => shipKey(s) + ':' + s.hp + ':' + s.team + ':' + s.name).join('|') + '#' + (S.sel ? shipKey(S.sel) : '');
      if (sig !== sideSig) { sideSig = sig; renderShips(); renderSel(); }
      renderChat(b.chat || []);
      renderScore(b.score);
    } catch (e) { if (e.message !== 'forbidden') $('status').textContent = String(e.message || e); }
    finally { polling = false; }
  }
  async function pollLoop() {
    const t0 = performance.now();
    // Locked: no request until the form is submitted (its onsubmit polls).
    if ($('lock').classList.contains('hidden')) await poll();
    const locked = !$('lock').classList.contains('hidden');
    setTimeout(pollLoop, locked ? 1000 : Math.max(0, POLL_MS - (performance.now() - t0)));
  }

  // Terrain, water and objects are built once per battle into GPU meshes (see
  // the renderer). Positions are relative to the cropped grid's centre (T.o),
  // so float32 keeps sub-unit precision across a 300 km map. The host's grid
  // samples sit at the cell centres.
  //
  //   crop     to the cells that actually have a surface. The host's grid
  //            spans the boundary volumes, which on Highlands is 2.7x the
  //            ground;

  function draw() {

    gl.uniform3f(PM.u.uTint, 1, 1, 1); gl.uniform3fv(PM.u.uL, LIGHT); gl.uniform3fv(PM.u.uFogC, BG);
